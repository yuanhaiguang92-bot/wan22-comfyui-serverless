<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAN2.2 独立测试 V0.1.2</title>
<style>body{font:15px system-ui;background:#101822;color:#e6edf5;max-width:1450px;margin:auto;padding:24px}h1{font-size:25px}p{color:#b9c9d9;line-height:1.7}.card{background:#192534;border:1px solid #33465b;border-radius:14px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{display:block;line-height:2}input,textarea,button,select{font:inherit;color:inherit;background:#22354a;border:1px solid #4b6380;border-radius:7px;padding:9px;max-width:95%}button{cursor:pointer;margin:5px}button:disabled{opacity:.4;cursor:default}video{width:100%;height:330px;background:#080d15}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#9fdbcf}small{color:#adc0d1}img{max-height:120px;max-width:100%}.warning{border-left:4px solid #f5be65;padding-left:15px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<h1>WAN2.2 Animate · 独立测试 <small>V0.1.2</small></h1>
<p class="warning">原成功工具保持不变。本版尚未部署或通过 GPU 验收。付费开关默认关闭；当前仅做本地准备。首轮仅测短片，长视频续接未完成。</p>
<section class="card"><h2>同素材对照</h2><div class="grid"><label>原视频（首轮10秒）<input id="video" type="file" accept="video/*"></label><label>新人物参考图<input id="person" type="file" accept="image/*"><img id="personPreview"></label><label>新场景图<input id="scene" type="file" accept="image/*"><img id="scenePreview"></label></div><label>实验模式<select id="mode"><option value="person_scene_combined">B · 整张图参考人物＋场景（本次选定）</option><option value="person_only">A · 仅换人（独立版复现）</option><option value="person_scene">B · 换人＋换背景（实验）</option></select></label><label>固定Seed<input id="seed" type="number" value="250416347570032" min="0"></label><button id="prepare">1. 保存素材并准备（不提交GPU）</button><p><label><input id="confirm" type="checkbox">已获得本次付费GPU测试授权，仅提交当前这一条任务</label><button id="submit" disabled>2. 提交独立测试任务</button><button id="query">只查询 / 恢复当前任务</button></p><pre id="info">读取独立配置…</pre><pre id="status">未准备</pre><pre id="error"></pre></section>
<section class="card"><h2>同步对比与本机结果</h2><div class="grid" id="compare"><div>原视频<video id="v0" controls muted></video></div><div>A · 仅换人<video id="v1" controls muted></video></div><div>B · 换人＋背景<video id="v2" controls muted></video></div></div><button id="play">同步从头播放</button><button id="pause">全部暂停</button><button id="fullscreen">放大对比</button><input id="seek" type="range" min="0" max="15" value="0" step=".01"><pre id="duration">未读取视频</pre><p>验收：产品形状/颜色/细杆/轮子/孔洞、手部接触、遮挡、动作、镜头、顺序、完整时长。自动标记的帧数通过不等于产品质量通过。</p><div id="download"></div></section>
<section class="card"><h2>历史（保存在独立目录）</h2><p>网络异常时保留任务ID，不自动重复提交。点击历史记录可恢复查询与播放。即使关闭页面，RunPod中已提交的任务仍可能继续运行。</p><div id="history"></div></section>
<script>
'use strict';
const $=id=>document.getElementById(id), vs=['v0','v1','v2'].map($);let info,current,job,assets={},polling=false;const objectUrls={};
function err(e){$('error').textContent=e.message||String(e);}
async function api(path,options={}){options.headers={...(options.headers||{}),'X-Lab-Token':info?.csrf_token||''};let r=await fetch(path,options),x=await r.json();if(!r.ok)throw Error(x.error||'请求失败');return x;}
function post(path,data){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}
function render(x){job=x;current=x.id;sessionStorage.setItem('wan22-lab-current',current);$('status').textContent=JSON.stringify({本地记录:x.id,真实阶段:x.stage,RunPod状态:x.provider_status,GPU任务ID:x.gpu_task_id||'未提交',累计秒:x.elapsed_seconds?.toFixed(1),排队毫秒:x.delay_ms,执行毫秒:x.execution_ms,worker:x.worker_output,完整时长核验:x.timeline_check,错误:x.error,查询异常:x.last_query_error},null,2);$('submit').disabled=!info.paid_enabled||x.stage!=='prepared_local';if(x.assets?.video){const src='/api/media?id='+encodeURIComponent(x.assets.video);if(vs[0].getAttribute('src')!==src)vs[0].src=src;}if(x.result_available){const u='/api/result?id='+encodeURIComponent(x.id);if(vs[x.mode==='person_only'?1:2].getAttribute('src')!==u)vs[x.mode==='person_only'?1:2].src=u;const a=document.createElement('a');a.href=u;a.download=x.id+'.mp4';a.textContent='下载已保存成品';$('download').replaceChildren(a);}if(x.error)$('error').textContent=x.error;}
async function refreshHistory(){const rows=await api('/api/history'),root=$('history');root.replaceChildren();for(const x of rows){const b=document.createElement('button');b.textContent=new Date(x.created_at*1000).toLocaleString()+' · '+x.mode+' · '+x.stage;b.onclick=()=>{render(x);if(x.gpu_task_id)query();};root.append(b);}if(job){for(const mode of ['person_only','scene_any']){const x=rows.find(x=>x.result_available&&(mode==='person_only'?x.mode==='person_only':x.mode!=='person_only')&&x.seed===job.seed&&x.asset_hashes?.video===job.asset_hashes?.video&&x.asset_hashes?.person===job.asset_hashes?.person);const v=vs[mode==='person_only'?1:2];if(x){const src='/api/result?id='+encodeURIComponent(x.id);if(v.getAttribute('src')!==src)v.src=src;}else{v.removeAttribute('src');v.load();}}}}
async function query(){if(!current||polling)return;polling=true;try{render(await api('/api/status?id='+encodeURIComponent(current)));await refreshHistory();}catch(e){err(e);}finally{polling=false;}}
for(const role of ['video','person','scene'])$(role).onchange=()=>{const f=$(role).files[0];if(!f)return;if(objectUrls[role])URL.revokeObjectURL(objectUrls[role]);objectUrls[role]=URL.createObjectURL(f);if(role==='video')vs[0].src=objectUrls[role];else $(role+'Preview').src=objectUrls[role];};
$('prepare').onclick=async()=>{try{$('error').textContent='';$('prepare').disabled=true;const required=['video','person',...($('mode').value==='person_scene'?['scene']:[])];for(const r of required)if(!$(r).files[0])throw Error('缺少素材：'+r);assets={};for(const role of required){$('status').textContent='本地保存/检查素材：'+role;const f=$(role).files[0];const x=await api('/api/asset?role='+role+'&name='+encodeURIComponent(f.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});assets[role]=x.id;}render(await post('/api/prepare',{mode:$('mode').value,assets,seed:$('seed').value}));await refreshHistory();}catch(e){err(e);}finally{$('prepare').disabled=false;}};
$('submit').onclick=async()=>{try{if(!$('confirm').checked)throw Error('需要本次付费授权确认');$('submit').disabled=true;render(await post('/api/submit',{id:current,confirm_paid:true}));await refreshHistory();}catch(e){err(e);await refreshHistory();if(current){const rows=await api('/api/history');const x=rows.find(x=>x.id===current);if(x)render(x);}}};
$('query').onclick=query;
$('play').onclick=async()=>{try{vs.forEach(v=>{if(v.src)v.currentTime=0;});await Promise.all(vs.filter(v=>v.src).map(v=>v.play()));}catch(e){err(e);}};
$('pause').onclick=()=>vs.forEach(v=>v.pause());
$('seek').oninput=e=>vs.forEach(v=>{if(v.src)v.currentTime=Math.min(+e.target.value,v.duration||0);});
$('fullscreen').onclick=()=>$('compare').requestFullscreen().catch(err);
vs.forEach(v=>v.onloadedmetadata=()=>{$('duration').textContent=vs.map((v,i)=>['原片','A','B'][i]+'：'+(Number.isFinite(v.duration)?v.duration.toFixed(4)+'秒':'未导入')).join('\n');});
vs[0].ontimeupdate=()=>{if(!vs[0].paused)for(const v of vs.slice(1))if(v.src&&!v.paused&&Math.abs(v.currentTime-vs[0].currentTime)>.12&&vs[0].currentTime<v.duration)v.currentTime=vs[0].currentTime;};
(async()=>{info=await api('/api/info');$('info').textContent='版本：'+info.version+'；付费生成：'+(info.paid_enabled?'已解锁':'关闭')+'；独立Endpoint：'+(info.configured_test_endpoint||'未配置');current=sessionStorage.getItem('wan22-lab-current');await refreshHistory();if(current){const rows=await api('/api/history'),x=rows.find(x=>x.id===current);if(x)render(x);}setInterval(()=>{if(current&&job?.gpu_task_id&&!['saved_local','result_missing','worker_failed','failed','cancelled','timed_out','download_failed'].includes(job.stage))query();},4000);})().catch(err);
</script></html>
